# Squid configuration reproducing a legacy corporate proxy: every request has to be
# authenticated with Basic credentials and nothing is cached by the proxy itself.
http_port 3128

auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic children 2
auth_param basic realm kagami-legacy-proxy
auth_param basic credentialsttl 1 minute

acl authenticated proxy_auth REQUIRED
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 1024-65535
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow authenticated
http_access deny all

cache deny all
hosts_file /etc/hosts
buffered_logs off
logfile_rotate 0
access_log stdio:/var/log/squid/access.log
cache_log stdio:/dev/stdout
pid_filename none
